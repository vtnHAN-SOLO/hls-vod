# The web image's server: the built SPA from /srv/web on 8080.
#
# Security headers: /etc/nginx/snippets/security-headers.conf is generated
# from web/security-headers.json when the image is built. nginx drops the
# server's add_header lines in any location that has add_header of its own,
# so every such location includes the file again. Every header is "always",
# so a 404 carries them too.

server {
    listen 8080;
    server_name _;
    root /srv/web;

    server_tokens off;
    # The SPA's routes are client-side: never answer with a redirect that
    # names the internal port.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    include /etc/nginx/snippets/security-headers.conf;

    # Probes: the process serves, that is all there is to check (no
    # dependency). Not logged. For the kubelet only: a request that came
    # through a proxy (the ingress controller always sets X-Forwarded-For)
    # gets the same 404 as any missing page, so the site never exposes them.
    location = /healthz {
        access_log off;
        default_type text/plain;
        if ($http_x_forwarded_for) {
            return 404 "not found\n";
        }
        return 200 "ok\n";
    }
    location = /readyz {
        access_log off;
        default_type text/plain;
        if ($http_x_forwarded_for) {
            return 404 "not found\n";
        }
        return 200 "ok\n";
    }

    # Hashed build output: the name changes with the content.
    # A missing file is a 404, never index.html: a script tag must not get HTML.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
        error_page 404 = @asset_missing;
    }
    # Plain text, not nginx's HTML error page, and never cached (the file
    # may exist after the next deploy). Headers: the server's.
    location @asset_missing {
        default_type text/plain;
        return 404 "not found\n";
    }

    # Unhashed files with stable names: a day.
    location ~ ^/(favicon\.ico|logo(-[0-9]+)?\.png|manifest\.webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # The app shell: always revalidated, so a deploy reaches every browser.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Everything else is a client route (/browse, /about, /movies/…): the
    # shell, which the router then draws.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

# nginx's connection counters for the metrics exporter (a sidecar in the same
# pod), on loopback only: never reachable through the Service.
server {
    listen 127.0.0.1:8082;
    server_name _;
    server_tokens off;
    access_log off;

    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
    location / {
        return 404;
    }
}
