# metrics-server v0.9.1's release asset (components.yaml, unchanged), moved
# into its own namespace, the image pinned by digest. kind's kubelets serve
# self-signed certificates, hence --kubelet-insecure-tls: local only.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: metrics-server
resources:
  - namespace.yaml
  - components.yaml
images:
  - name: registry.k8s.io/metrics-server/metrics-server
    digest: sha256:9b0ba1926e1d3089673f45461c3c1416109dea33b3ba3434048defd380df329b
patches:
  - target:
      kind: Deployment
      name: metrics-server
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
