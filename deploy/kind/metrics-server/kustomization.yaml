# metrics-server for the HPA (make kind-up). The one object that cannot
# move with it: the RoleBinding that lets it read the API server's
# authentication ConfigMap must live in kube-system, next to that Role.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - upstream
patches:
  - target:
      kind: RoleBinding
      name: metrics-server-auth-reader
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: kube-system
      - op: replace
        path: /subjects/0/namespace
        value: metrics-server
