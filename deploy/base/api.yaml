# The api: two replicas, no Kubernetes permissions, no files. The init
# container applies the migrations from the same image before the api
# starts; goose's session lock makes the two replicas' runs take turns, so
# a rollout of both at once is safe.
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: hls-vod/app
          command: ["/usr/local/bin/migrate", "up"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hls-vod-db
                  key: DATABASE_URL
          envFrom:
            - configMapRef:
                name: hls-vod-config
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: hls-vod/app
          command: ["/usr/local/bin/api"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hls-vod-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hls-vod-db
                  key: DATABASE_URL
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: hls-vod-api
                  key: JWT_SIGNING_KEY
            - name: MEDIA_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: hls-vod-api
                  key: MEDIA_SIGNING_KEY
          readinessProbe:
            # Postgres reachable: failing removes the pod from the Service.
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            # The process only: a database outage must not restart every pod.
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            # 512Mi: one poster at a time (internal/poster: a 25 MP upload
            # decodes to ~100 MB, plus the 10 MB body, the variants and GC
            # headroom; 256Mi was OOMKilled by make kind-smoke step 11),
            # beside at most two argon2id hashes of 19 MiB (internal/auth).
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
