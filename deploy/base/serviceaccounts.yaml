# One ServiceAccount per workload, none with a token mounted except the
# dispatcher's (dispatcher.yaml), the only one that talks to Kubernetes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: media-delivery
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: watcher
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
automountServiceAccountToken: false
---
# The transcoder Jobs' account (TRANSCODER_SERVICE_ACCOUNT): no Role is bound
# to it and the dispatcher never mounts its token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: transcoder
automountServiceAccountToken: false
