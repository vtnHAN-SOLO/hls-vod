# media-delivery: nginx serving HLS from the media volume, READ-ONLY, to
# URLs the api signed. Stateless, so it is the tier the HPA scales (2-5 on
# CPU). The image renders its config template with MEDIA_SIGNING_KEY into
# /etc/nginx/conf.d at start: an emptyDir, memory only. Readiness lists
# library/, so a lost media mount takes the pod out of the Service.
apiVersion: v1
kind: Service
metadata:
  name: media-delivery
spec:
  selector:
    app: media-delivery
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-delivery
spec:
  # No replicas: the HPA owns the count (a value here would reset it on
  # every apply).
  selector:
    matchLabels:
      app: media-delivery
  template:
    metadata:
      labels:
        app: media-delivery
    spec:
      serviceAccountName: media-delivery
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: media-delivery
          image: hls-vod/media-delivery
          ports:
            - name: http
              containerPort: 8080
          env:
            # The signing key only: nginx never sees the database or JWT keys.
            - name: MEDIA_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: hls-vod-api
                  key: MEDIA_SIGNING_KEY
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: media
              mountPath: /srv/media
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: tmp
              mountPath: /tmp
        - name: exporter
          image: nginx/nginx-prometheus-exporter:1.5.3@sha256:85666e7fde7e253f1c6d978f9a961245df4c9cdb7677e1866d9bb28e8f9ee41d
          args: ["--nginx.scrape-uri=http://127.0.0.1:8082/stub_status"]
          ports:
            - name: metrics
              containerPort: 9113
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media
            readOnly: true
        - name: conf
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: media-delivery
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: media-delivery
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
