# Default deny, then only the paths the system uses. Pods are selected by
# their "app" label (the transcoder Jobs' pods carry app=transcoder, set by
# internal/dispatch). Prometheus scraping is added with monitoring.
#
# Destinations outside the cluster are given by port only: the api's mail,
# sign-in and captcha providers have no fixed addresses, and the Kubernetes
# API's address differs per cluster. An overlay may narrow them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# The ingress controller, in its own namespace "traefik", to the three
# routed Services.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["web", "api", "media-delivery"]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
---
# Postgres accepts the workloads that use it, and nothing else. useradmin is
# the one-off Job that creates accounts.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["api", "dispatcher", "watcher", "transcoder", "useradmin"]
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-clients-egress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: ["api", "dispatcher", "watcher", "transcoder", "useradmin"]
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
---
# The api calls Resend, Google and Cloudflare Turnstile over HTTPS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-egress-https
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes: ["Egress"]
  egress:
    - ports:
        - protocol: TCP
          port: 443
---
# The dispatcher talks to the Kubernetes API: the Service on 443, which
# reaches the API server on 6443 once translated.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dispatcher-egress-kube-api
spec:
  podSelector:
    matchLabels:
      app: dispatcher
  policyTypes: ["Egress"]
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
