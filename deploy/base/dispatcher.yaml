# The dispatcher: starts a transcoder Job for each queued job, at most
# MAX_CONCURRENT at once, and reconciles them. The only workload with a
# Kubernetes token, and the Role behind it covers Jobs in this namespace
# and nothing else. The Jobs it builds (internal/dispatch) run as the
# transcoder ServiceAccount, with no permissions and no token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dispatcher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dispatcher
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dispatcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dispatcher
subjects:
  - kind: ServiceAccount
    name: dispatcher
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dispatcher
  template:
    metadata:
      labels:
        app: dispatcher
    spec:
      serviceAccountName: dispatcher
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dispatcher
          image: hls-vod/app
          command: ["/usr/local/bin/dispatcher"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hls-vod-config
          env:
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TRANSCODER_IMAGE
              valueFrom:
                configMapKeyRef:
                  name: hls-vod-transcoder-image
                  key: TRANSCODER_IMAGE
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: hls-vod-db
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
