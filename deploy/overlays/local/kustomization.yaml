# kind only (make kind-up). Differences from production, on purpose:
#   - images hls-vod/<name>:dev from `make images`, loaded into the node with
#     `kind load`, never pulled (imagePullPolicy: Never). The dispatcher's
#     TRANSCODER_IMAGE (ConfigMap hls-vod-transcoder-image) is the same
#     image by the digest the node holds, written by scripts/kind-up.sh.
#   - media: a PVC on kind's default storage class (local-path,
#     ReadWriteOnce). One node, so the read-only mount of media-delivery and
#     the read-write ones of the watcher and the transcoder share it.
#     Production uses an NFS volume, ReadWriteMany.
#   - secrets are generated by scripts/kind-up.sh and applied with kubectl,
#     never written into the repository.
#   - registration closed and no mail (MAIL_BACKEND=none), Google off.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hls-vod

resources:
  - ../../base
  - media-pvc.yaml

images:
  - name: hls-vod/app
    newTag: dev
  - name: hls-vod/web
    newTag: dev
  - name: hls-vod/media-delivery
    newTag: dev

configMapGenerator:
  - name: hls-vod-config
    behavior: merge
    literals:
      # kind's pod network (deploy/kind/cluster.yaml podSubnet): the ingress
      # controller's pods are the only proxies in front of the api.
      - TRUSTED_PROXIES=10.244.0.0/16
      - REGISTRATION_OPEN=false
      - MAIL_BACKEND=none
      - SITE_NAME=HLS VOD

patches:
  - path: pull-never.yaml
