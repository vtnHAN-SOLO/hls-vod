# The hls-vod images exist only inside the kind node (kind load): never
# pulled. Postgres and the exporter keep the default policy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      initContainers:
        - name: migrate
          imagePullPolicy: Never
      containers:
        - name: api
          imagePullPolicy: Never
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      containers:
        - name: web
          imagePullPolicy: Never
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-delivery
spec:
  template:
    spec:
      containers:
        - name: media-delivery
          imagePullPolicy: Never
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcher
spec:
  template:
    spec:
      containers:
        - name: dispatcher
          imagePullPolicy: Never
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: watcher
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: watcher
              imagePullPolicy: Never
