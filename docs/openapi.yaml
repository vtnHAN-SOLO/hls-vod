openapi: 3.0.3
info:
  title: HLS VOD API
  version: 0.14.0
  description: |
    Catalog, watch progress and authentication endpoints. Every response under /api/ is
    JSON (except 204); errors always use the `Error` shape. Kept in sync
    with the code by internal/handler/openapi_test.go, which validates every
    handler test response against this file and fails if an operation or
    documented status is never exercised.

    Authentication: every endpoint needs `Authorization: Bearer <access
    token>` except those under `/api/v1/auth/` (login, refresh, logout,
    config, register, verify-email, resend-verification, forgot-password,
    reset-password, google/start, google/callback). Access tokens are HS256 JWTs
    valid for 15 minutes, returned in the login and refresh bodies; keep
    them in memory only. The refresh token (30 days) travels only in the
    HttpOnly `refresh_token` cookie (Path=/api/v1/auth, SameSite=Strict,
    Secure). Each refresh rotates it; presenting an already-rotated token
    revokes the whole session. refresh and logout also need an
    `X-Requested-With` header (CSRF defence).

    Every access token carries a `sid` claim: the session (one login, one
    refresh-token family) it was issued for. A token without one is
    refused. Revoking a session (`/api/v1/me/sessions…`, or a password
    change) stops its refresh token at once; access tokens already issued
    to it keep working until they expire, at most 15 minutes, because the
    api checks them by signature only. Except on the session and password
    endpoints (`POST /api/v1/me/password`, `GET /api/v1/me/sessions`,
    `DELETE /api/v1/me/sessions/{id}`, `POST /api/v1/me/sessions/revoke-others`):
    they first check that the caller's own session is still live, and
    answer 401 when it is not, so a revoked device can neither change the
    password nor revoke the session that revoked it.

    Registration: anyone may sign up while `REGISTRATION_OPEN=true`
    (otherwise register is 403; everything else keeps working). A new
    account is unverified until the link mailed to its address is opened:
    the link is `{PUBLIC_BASE_URL}/verify-email#token=…`, the token in the
    fragment so it never reaches a server log or a Referer header, and the
    SPA posts it to verify-email, which starts a session. An unverified
    account cannot log in (403 `email_not_verified`, only after a right
    password) and lives 24 hours: after that the next registration with its
    email or username deletes it. Accounts made with `cmd/useradmin` have
    no email and log in as before. register and resend-verification never
    reveal whether an address has an account: the same 202 and body either
    way (an address that has one gets a notice mail instead of a link), and
    mail is sent in the background. Usernames are public: a taken one is a
    409. Both need a solved Cloudflare Turnstile challenge
    (`turnstile_token`), and fail closed (503) when it cannot be checked;
    login asks for one only after 3 failures for a username from one
    address (401 `captcha_required`).

    Password reset uses a link of the same kind,
    `{PUBLIC_BASE_URL}/reset-password#token=…`: 30 minutes, single use,
    only the newest working. forgot-password answers like
    resend-verification (same 202 whatever the address; a mail only for a
    verified account). An account's email is fixed at registration, like
    its username: there is no email change. Accounts made with
    `cmd/useradmin` have no email and so no reset by mail; an admin sets
    their password with `useradmin set-password`.

    Sign in with Google (OpenID Connect, authorization code + PKCE), when
    `GET /api/v1/auth/config` says `google_enabled`. `google/start` is a
    plain link: it sets the `google_state` cookie (HttpOnly,
    SameSite=Lax, Path=/api/v1/auth/google, 10 minutes) and redirects to
    Google, which redirects back to `google/callback`. A successful
    sign-in sets the refresh cookie and redirects to
    `/auth/google/done`, where the SPA calls refresh for its access token:
    no token ever travels in a URL. A failure redirects to
    `/login?google_error=<code>` (or `/account?google_error=<code>` for a
    link). A Google account is identified by its subject only, never by its
    email. A first sign-in links to the verified account with the same
    email (a notice is mailed to it), deletes an unverified one, or creates
    a new account without a password (refused while registration is
    closed). Linking from the account page needs the current password.

    Admin area: every `/api/v1/admin/` endpoint checks, in the database on
    each request, that the caller is an admin who is not disabled (403
    otherwise, whatever role the access token carries: a demoted admin
    keeps that claim for up to 15 minutes) and that their session is live
    (401). A disabled account cannot log in (403 `account_disabled`, only
    after a right password), refresh, sign in with Google or verify its
    email, and gets no reset mail; disabling revokes every session at
    once, and access tokens already issued run out within 15 minutes.

    Media URLs (`playlist_url`, `thumbnails_url`, every `poster_url`) are
    signed: `/media/{token}/{expires}/{movie_id}/{file}` on media-delivery,
    which refuses a missing or wrong token (403) and an expired one (410).
    One token covers the movie's whole folder, so playlists, segments and
    sprites resolved relative to a signed URL carry it too. Playback URLs
    live at least 6 hours, poster URLs at least 24; responses that carry
    them are `Cache-Control: no-store`.
security:
  - bearerAuth: []
paths:
  /api/v1/movies:
    get:
      operationId: listMovies
      summary: List movies, filtered and sorted
      parameters:
        - name: status
          in: query
          description: |
            Admins only: only movies in this status; omitted or empty means
            every status. Any other caller always gets ready movies only,
            and sending this parameter is a 403.
          schema:
            $ref: "#/components/schemas/MovieStatus"
        - name: q
          in: query
          description: |
            Case-insensitive title search: movies whose title contains this
            text. `%` and `_` match themselves (no wildcards). Surrounding
            spaces are ignored; omitted or empty means any title. At most
            100 characters.
          schema: { type: string, maxLength: 100 }
        - name: sort
          in: query
          description: |
            Order of the list; omitted or empty means `added_desc` (newest
            first). `title_asc` is case-insensitive. The year sorts put
            movies without a year last in both directions and order one
            year by title. Every sort ends in an id tiebreak, so the order
            is stable and pages never overlap.
          schema:
            type: string
            enum: [added_desc, title_asc, year_desc, year_asc]
            default: added_desc
        - name: year_from
          in: query
          description: |
            Only movies released in this year or later (inclusive). Any
            year bound leaves out movies with no year. Must not be after
            `year_to`.
          schema: { type: integer, minimum: 1880, maximum: 2100 }
        - name: year_to
          in: query
          description: Only movies released in this year or earlier (inclusive).
          schema: { type: integer, minimum: 1880, maximum: 2100 }
        - name: limit
          in: query
          description: Page size. Values above 100 are rejected, not clamped.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          description: Number of movies to skip.
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
      responses:
        "200":
          description: One page of movies.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovieList" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/movies/{id}:
    get:
      operationId: getMovie
      summary: A movie with its renditions
      description: For a non-admin, a movie that is not ready does not exist (404).
      parameters:
        - $ref: "#/components/parameters/MovieID"
      responses:
        "200":
          description: The movie.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovieDetail" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/movies/{id}/playback:
    get:
      operationId: getPlayback
      summary: Where the player loads a ready movie from
      description: |
        Returns the signed master playlist and thumbnails URLs on
        media-delivery, valid for at least 6 hours, and where the caller
        stopped last time. A non-admin gets 404 for a movie that is not
        ready; an admin gets 409.
      parameters:
        - $ref: "#/components/parameters/MovieID"
      responses:
        "200":
          description: The movie is ready.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Playback" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The movie exists but its status is not `ready`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/progress:
    post:
      operationId: saveProgress
      summary: Save where the caller is in a movie
      description: |
        Upserts the caller's position in one movie; the user is always the
        access token's subject, never part of the body. Only a ready movie
        takes progress: a non-admin gets 404 for any other movie, an admin
        409. `position_sec` must lie between 0 and the movie's runtime (one
        week when the runtime is unknown).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgressRequest" }
      responses:
        "204":
          description: Saved.
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "409":
          description: Admin only, the movie exists but its status is not `ready`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: The body is not `application/json`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/continue-watching:
    get:
      operationId: continueWatching
      summary: The caller's unfinished movies, most recently watched first
      description: |
        Ready movies the caller has progress in, newest save first, at most
        20. A movie watched to 95% of its runtime or more is finished and
        left out.
      responses:
        "200":
          description: The caller's continue-watching row.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContinueWatching" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/auth/login:
    post:
      operationId: login
      summary: Start a session with a username and password
      description: |
        Usernames are case-insensitive. An unknown username and a wrong
        password get the same 401. From the third failure for one username
        from one address on, a login needs a solved Turnstile challenge in
        `turnstile_token` (401 `captcha_required` until then; the failure
        that reaches three already answers it). Five failures block the
        username from that address for 15 minutes (429, per api replica).
        Attempts still being checked count too, so a parallel burst cannot
        slip past either limit.

        Password spraying: failures are also counted per address across
        every username. From 10 in 15 minutes every login from that address
        needs the challenge; from 100 the address gets 429 for 15 minutes.
        A login below both thresholds never depends on Cloudflare.

        "Address" is the client's: the TCP peer, or, behind the proxies in
        TRUSTED_PROXIES, X-Forwarded-For read from the right. A header the
        client wrote itself is never believed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401":
          description: |
            Unknown username or wrong password (`invalid_credentials`), or a
            challenge is needed and was missing or rejected
            (`captcha_required`; also the answer to the failure that reaches
            three).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: |
            Right username and password, but the account's email is not
            confirmed yet (`email_not_verified`; use resend-verification),
            or an admin has disabled it (`account_disabled`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429":
          description: |
            Too many failed logins for this username from this address, or
            from this address across usernames, or too many still in flight
            (Retry-After 1).
          headers:
            Retry-After:
              required: true
              description: Seconds until the next attempt is accepted.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/CaptchaUnavailable" }

  /api/v1/auth/config:
    get:
      operationId: getAuthConfig
      summary: What the login and register pages need to know
      security: []
      responses:
        "200":
          description: Whether registration is open, and the Turnstile site key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthConfig" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }

  /api/v1/auth/register:
    post:
      operationId: register
      summary: Create an account; a verify link is mailed to the address
      description: |
        202 with the same body whether or not the address already has an
        account (that address gets a "someone tried to sign up with your
        email" mail instead). The account is unverified, role `user`. An
        unverified account whose link has expired and that holds the same
        email or username is deleted first. At most 10 attempts per hour
        from one address (per api replica).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400":
          description: |
            A malformed field (`invalid_request`, the message names it), or
            the challenge was missing or rejected (`captcha_failed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Registration is closed (`registration_closed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "409":
          description: |
            The username is taken (`username_taken`). Usernames are public,
            so this is accepted; it never depends on the email.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/CaptchaUnavailable" }

  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Confirm an address with the token from the mailed link
      description: |
        Marks the email verified, uses up the token and starts a session,
        answered like a login. A token is good once, for 24 hours from
        sign-up.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400":
          description: |
            A malformed body (`invalid_request`), or the token is unknown,
            expired or already used (`invalid_token`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: |
            An admin has disabled the account (`account_disabled`). The
            token is not used up: it works again if the account is enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Mail a new verify link to an unverified account
      description: |
        202 with the same body whether or not the address has an unverified
        account; only then is a mail sent. The new link expires when the
        first did (24 hours after sign-up). Works while registration is
        closed. At most 10 attempts per hour from one address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendVerificationRequest" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400":
          description: A malformed address (`invalid_request`), or the challenge failed (`captcha_failed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/CaptchaUnavailable" }

  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Mail a password-reset link
      description: |
        202 with the same body whether or not the address has an account;
        a mail goes out only for a verified account, and it names the
        account's username. The link lives 30 minutes and is good once; a
        new request makes the older links useless. Works while registration
        is closed. At most 10 attempts per hour from one address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "202": { $ref: "#/components/responses/Accepted" }
        "400":
          description: A malformed address (`invalid_request`), or the challenge failed (`captcha_failed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/CaptchaUnavailable" }

  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Set a new password with the token from the mailed link
      description: |
        In one transaction: the new password, every session of the user
        revoked, the token used. No session starts: log in with the new
        password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "204":
          description: The password is changed and every session ended.
        "400":
          description: |
            A malformed body or a password the policy refuses
            (`invalid_request`, checked first), or the token is unknown,
            expired or already used (`invalid_token`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/auth/google/start:
    get:
      operationId: googleStart
      summary: Start signing in with Google (a browser navigation)
      description: |
        Stores a new sign-in state, sets the `google_state` cookie and
        redirects to Google. When Google is not configured or cannot be
        reached, redirects to `/login?google_error=disabled` or
        `unavailable`.
      security: []
      responses:
        "302": { $ref: "#/components/responses/Redirect" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }

  /api/v1/auth/google/callback:
    get:
      operationId: googleCallback
      summary: Where Google sends the browser back
      description: |
        The `state` parameter must equal the `google_state` cookie and an
        unexpired, unused stored state (it is used up). The code is
        exchanged with the PKCE verifier and the ID token verified
        (signature, issuer, audience, expiry, nonce, verified email).
        Success: a login sets the refresh cookie and redirects to
        `/auth/google/done`; a link redirects to `/account?google=linked`.
        Failure: `/login?google_error=<code>` (`/account?…` for a link),
        code one of state, denied, unavailable, exchange, token,
        email_unverified, registration_closed, linked_elsewhere,
        already_linked, account_disabled, server, disabled. The cookie is
        always cleared.
      security: []
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string }, description: "Google's error, e.g. access_denied" }
        - { name: scope, in: query, schema: { type: string } }
        - { name: authuser, in: query, schema: { type: string } }
        - { name: prompt, in: query, schema: { type: string } }
        - { name: hd, in: query, schema: { type: string } }
        - { name: iss, in: query, schema: { type: string } }
      responses:
        "302": { $ref: "#/components/responses/Redirect" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }

  /api/v1/auth/refresh:
    post:
      operationId: refresh
      summary: Rotate the refresh token and get a new access token
      description: |
        The presented refresh token is revoked and replaced. Presenting a
        token that was already rotated is reuse: the whole session (every
        token from that login) is revoked. A refused refresh clears the cookie.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: End the session the refresh cookie belongs to
      description: Revokes every token of that login and clears the cookie. Idempotent.
      security: []
      parameters:
        - $ref: "#/components/parameters/RefreshCookie"
        - $ref: "#/components/parameters/CSRFHeader"
      responses:
        "204":
          description: Logged out (or was not logged in).
          headers:
            Set-Cookie:
              required: true
              schema: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/me:
    get:
      operationId: getMe
      summary: The caller's account
      responses:
        "200":
          description: The access token's user.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/me/password:
    post:
      operationId: changePassword
      summary: Change the caller's password
      description: |
        Checks `current_password`, then in one transaction stores the new
        password, revokes every session of the user and starts a new one
        for the caller, returned like a login (body and refresh cookie): the
        tab that asked stays logged in, every other session is logged out
        at its next refresh. The new password must be 12 to 1024 characters
        and differ from the current one. Five wrong current passwords block
        the user's password changes for 15 minutes (429, per api replica);
        logins are throttled separately.
        A 401 also when the caller's own session has been revoked or has
        expired, though the access token is still within its 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChangeRequest" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400":
          description: |
            A malformed body or a new password the policy refuses
            (`invalid_request`), or a wrong current password
            (`invalid_credentials`; 400, not 401, since the access token is fine).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415":
          description: The body is not `application/json`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many wrong current passwords for this user.
          headers:
            Retry-After:
              required: true
              description: Seconds until the next attempt is accepted.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/me/google/link:
    post:
      operationId: googleLink
      summary: Start linking a Google account to the caller's
      description: |
        Needs the current password: otherwise a stolen session could link
        the attacker's Google account as a permanent way in. Wrong
        passwords count toward the same per-user limit as the password
        change. Sets the `google_state` cookie and returns the Google URL
        the SPA navigates to; the callback then links. A 401 also when the
        caller's own session has been revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GoogleLinkRequest" }
      responses:
        "200":
          description: Navigate to `url`.
          headers:
            Set-Cookie: { required: true, schema: { type: string } }
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoogleLink" }
        "400":
          description: |
            A malformed body or no password (`invalid_request`), or a wrong
            current password (`invalid_credentials`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Sign in with Google is not enabled (`not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429":
          description: Too many wrong current passwords for this user (shared with the password change).
          headers:
            Retry-After:
              required: true
              description: Seconds until the next attempt is accepted.
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/me/google:
    delete:
      operationId: googleUnlink
      summary: Remove the caller's Google account
      description: |
        Refused (409 `last_login_method`) when the account has no password:
        Google is then its only way to log in. A 401 also when the caller's
        own session has been revoked.
      responses:
        "204":
          description: Removed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No Google account is linked (`not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "409":
          description: The account has no password (`last_login_method`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/me/password/set-link:
    post:
      operationId: passwordSetLink
      summary: Mail a link to set a password (accounts without one)
      description: |
        For a Google-only account: a password-reset link (30 minutes,
        single use) to the account's own verified email, with the mail
        limits of forgot-password. Setting the password through it ends
        every session. 400 when the account already has a password (change
        it with the current one instead). A 401 also when the caller's own
        session has been revoked.
      responses:
        "202":
          description: Accepted; check the inbox.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Accepted" }
        "400":
          description: The account already has a password (`invalid_request`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/me/sessions:
    get:
      operationId: listSessions
      summary: The caller's active sessions
      description: |
        One entry per login that can still refresh, most recently used
        first. Never a token or a hash.
        A 401 also when the caller's own session has been revoked or has
        expired, though the access token is still within its 15 minutes.
      responses:
        "200":
          description: The caller's sessions.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/me/sessions/{id}:
    delete:
      operationId: revokeSession
      summary: Sign one of the caller's sessions out
      description: |
        Revokes that login's refresh token. The caller's current session
        may be revoked too; the client then behaves as after logout.
        A 401 also when the caller's own session has been revoked or has
        expired, though the access token is still within its 15 minutes.
      parameters:
        - name: id
          in: path
          required: true
          description: A session id from the list.
          schema: { type: string }
      responses:
        "204":
          description: Revoked.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: |
            Not an active session of the caller: unknown, already ended,
            another user's, or not a UUID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/me/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      summary: Sign out everywhere else
      description: |
        Revokes every session of the caller except the current one.
        A 401 also when the caller's own session has been revoked or has
        expired, though the access token is still within its 15 minutes.
      responses:
        "204":
          description: Revoked.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/admin/users:
    get:
      operationId: adminListUsers
      summary: "Admin: list users"
      parameters:
        - name: q
          in: query
          description: |
            Case-insensitive substring of the username or the email, matched
            literally (`%` and `_` are not wildcards). At most 100 characters.
          schema: { type: string, maxLength: 100 }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One page of users, by username. Never a hash or token.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserList" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotAdmin" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/admin/users/{id}/disable:
    post:
      operationId: adminDisableUser
      summary: "Admin: disable a user"
      description: |
        Sets disabled_at and revokes every session of the user, in one
        transaction. Their access tokens run out within 15 minutes. Not
        your own account, and never the last active admin (409). Disabling
        twice keeps the first time.
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotAdmin" }
        "404": { $ref: "#/components/responses/UserNotFound" }
        "409": { $ref: "#/components/responses/AdminConflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/admin/users/{id}/enable:
    post:
      operationId: adminEnableUser
      summary: "Admin: enable a disabled user"
      description: Clears disabled_at. Revoked sessions stay revoked; the user logs in again.
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotAdmin" }
        "404": { $ref: "#/components/responses/UserNotFound" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/admin/users/{id}/role:
    put:
      operationId: adminSetRole
      summary: "Admin: change a user's role"
      description: |
        Not your own role, and never demoting the last active admin (409).
        The admin endpoints see the change at once; the user's other
        requests see it at their next refresh (15 minutes at most).
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleRequest" }
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotAdmin" }
        "404": { $ref: "#/components/responses/UserNotFound" }
        "409": { $ref: "#/components/responses/AdminConflict" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/admin/jobs:
    get:
      operationId: adminListJobs
      summary: "Admin: transcode jobs"
      parameters:
        - name: status
          in: query
          description: Only jobs in this status; omitted or empty means every status.
          schema: { $ref: "#/components/schemas/JobStatus" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One page of jobs, newest first.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobList" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotAdmin" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/admin/movies:
    get:
      operationId: adminListMovies
      summary: "Admin: movies of every status, with their active job"
      parameters:
        - name: status
          in: query
          description: Only movies in this status (deleting included); omitted or empty means every status.
          schema: { $ref: "#/components/schemas/MovieStatus" }
        - name: q
          in: query
          description: Case-insensitive title substring, as on /api/v1/movies.
          schema: { type: string, maxLength: 100 }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: One page of movies, newest first.
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMovieList" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotAdmin" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/admin/movies/{id}/retry:
    post:
      operationId: adminRetryMovie
      summary: "Admin: transcode a failed movie again"
      description: |
        Only for status failed: sets it pending and queues a new transcode
        job, from the source still in sources/. A second click finds it no
        longer failed (409 `not_failed`); the database refuses a second
        active job for one movie (409 `job_active`).
      parameters:
        - $ref: "#/components/parameters/MovieID"
      responses:
        "202": { $ref: "#/components/responses/AdminAccepted" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotAdmin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MovieConflict" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/admin/movies/{id}/retranscode:
    post:
      operationId: adminRetranscodeMovie
      summary: "Admin: transcode a ready movie again, into a new version"
      description: |
        Only for status ready (else 409 `not_ready`), and not while a job is
        queued or running (409 `job_active`). Queues a job with purpose
        `retranscode`. The movie stays ready and keeps playing its current
        version during the job; the transcoder publishes a new version
        folder and switches the movie to it in one transaction (new URLs
        carry the new folder). A failed retranscode leaves the movie on its
        current version. The replaced version stays on disk until every URL
        signed for it has expired (25 hours: `library_cleanup_after`), then
        the watcher removes it.
      parameters:
        - $ref: "#/components/parameters/MovieID"
      responses:
        "202": { $ref: "#/components/responses/AdminAccepted" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotAdmin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `not_ready`: only a ready movie can be retranscoded. `job_active`:
            the movie has a queued or running transcode job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/Internal" }

  /api/v1/admin/movies/{id}:
    delete:
      operationId: adminDeleteMovie
      summary: "Admin: delete a movie"
      description: |
        Refused while a transcode job is queued or running (409
        `job_active`). Otherwise the movie becomes `deleting` at once:
        hidden from every non-admin endpoint and from continue-watching,
        and refused for playback. The watcher's next run (every 5 minutes)
        removes library/{id}/ and the source file, then the row, with its
        renditions, jobs and watch progress. Deleting a movie that is
        already deleting is a 202 again.
      parameters:
        - $ref: "#/components/parameters/MovieID"
      responses:
        "202": { $ref: "#/components/responses/AdminAccepted" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NotAdmin" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MovieConflict" }
        "500": { $ref: "#/components/responses/Internal" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    MovieID:
      name: id
      in: path
      required: true
      description: Lowercase or uppercase UUID; anything else is a 400.
      schema: { type: string, format: uuid }
    RefreshCookie:
      name: refresh_token
      in: cookie
      required: false
      description: Set by login and refresh; HttpOnly, so scripts never read it.
      schema: { type: string }
    UserID:
      name: id
      in: path
      required: true
      description: A user's UUID; anything else is a 400.
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      description: Page size. Values above 100 are rejected, not clamped.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Offset:
      name: offset
      in: query
      description: Number of rows to skip.
      schema: { type: integer, format: int64, minimum: 0, default: 0 }
    CSRFHeader:
      name: X-Requested-With
      in: header
      required: true
      description: Any non-empty value, e.g. `XMLHttpRequest`. Missing means 403.
      schema: { type: string, minLength: 1 }

  responses:
    InvalidRequest:
      description: A query or path parameter, or the request body, is malformed or out of range.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No movie with this id.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: |
        No valid access token (missing, expired, wrong signature or
        algorithm), or for refresh no valid refresh token.
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        Authenticated but not allowed: `?status=` without the admin role, or
        refresh/logout without the X-Requested-With header.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Session:
      description: |
        A new session. The refresh token is only in the Set-Cookie header
        (refresh_token, HttpOnly, Path=/api/v1/auth, SameSite=Strict).
      headers:
        Set-Cookie:
          required: true
          schema: { type: string }
        Cache-Control:
          schema: { type: string, enum: [no-store] }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Session" }
    MethodNotAllowed:
      description: Wrong HTTP method; the Allow header lists the right ones.
      headers:
        Allow:
          required: true
          schema: { type: string, minLength: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: The body is not `application/json`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many attempts from this address (`rate_limited`).
      headers:
        Retry-After:
          required: true
          description: Seconds until the next attempt is accepted.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CaptchaUnavailable:
      description: |
        The Turnstile challenge cannot be checked right now (Cloudflare
        unreachable, or Turnstile not configured): refused, never let
        through (`captcha_unavailable`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Redirect:
      description: A redirect; the target is in Location. No body.
      headers:
        Location:
          required: true
          schema: { type: string, minLength: 1 }
        Cache-Control:
          schema: { type: string, enum: [no-store] }
    Accepted:
      description: |
        Accepted. The same answer whether or not the address has an
        account, so it tells nothing; any mail goes out in the background.
      headers:
        Cache-Control:
          schema: { type: string, enum: [no-store] }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Accepted" }
    NotAdmin:
      description: |
        The caller is not an admin, or is a disabled one, as the database
        says now (`forbidden`): the role in the access token is not trusted
        here.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UserNotFound:
      description: No user with this id.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AdminUser:
      description: The user after the change.
      headers:
        Cache-Control:
          schema: { type: string, enum: [no-store] }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminUser" }
    AdminConflict:
      description: |
        `self_change`: your own account cannot be disabled and your own
        role cannot be changed. `last_admin`: the change would leave no
        active (not disabled) admin; checked in a transaction that locks
        every admin row, so two admins demoting each other at once cannot
        both succeed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    MovieConflict:
      description: |
        `not_failed`: only a failed movie can be retried. `job_active`: the
        movie has a queued or running transcode job.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AdminAccepted:
      description: Accepted; the dispatcher or the watcher does the rest. No body.
      headers:
        Cache-Control:
          schema: { type: string, enum: [no-store] }
    Internal:
      description: Unexpected failure. Details are logged, never returned.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    MovieStatus:
      type: string
      description: deleting is seen by admins only.
      enum: [pending, processing, ready, failed, deleting]

    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed]

    JobPurpose:
      type: string
      description: |
        ingest: a new (or retried) movie, pending → processing → ready or
        failed. retranscode: a ready movie gets a new version and stays
        ready throughout.
      enum: [ingest, retranscode]

    RoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { type: string, enum: [user, admin] }

    AdminUser:
      type: object
      additionalProperties: false
      required: [id, username, email, email_verified_at, role, google_linked, has_password, disabled_at, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, nullable: true, description: null for an account made with useradmin. }
        email_verified_at: { type: string, format: date-time, nullable: true }
        role: { type: string, enum: [user, admin] }
        google_linked: { type: boolean }
        has_password: { type: boolean }
        disabled_at:
          type: string
          format: date-time
          nullable: true
          description: When an admin disabled the account; null while it is enabled.
        created_at: { type: string, format: date-time }

    AdminUserList:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer, format: int64 }

    Job:
      type: object
      additionalProperties: false
      required: [id, movie_id, movie_title, status, purpose, started_at, finished_at, error_msg, k8s_job_name, local_pid, created_at]
      properties:
        id: { type: string, format: uuid }
        movie_id: { type: string, format: uuid }
        movie_title: { type: string }
        status: { $ref: "#/components/schemas/JobStatus" }
        purpose: { $ref: "#/components/schemas/JobPurpose" }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        error_msg:
          type: string
          nullable: true
          description: As the transcoder or dispatcher stored it (already bounded).
        k8s_job_name:
          type: string
          nullable: true
          description: The Kubernetes Job, for the kubernetes dispatcher backend.
        local_pid:
          type: integer
          nullable: true
          description: The transcoder's process id, for the local dispatcher backend.
        created_at: { type: string, format: date-time }

    JobList:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Job" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer, format: int64 }

    AdminMovie:
      type: object
      additionalProperties: false
      required: [id, title, year, status, active_job, active_job_purpose, library_cleanup_after, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        year: { type: integer, nullable: true }
        status: { $ref: "#/components/schemas/MovieStatus" }
        active_job:
          type: string
          nullable: true
          enum: [queued, running, null]
          description: The status of the movie's queued or running job; null when it has none.
        active_job_purpose:
          type: string
          nullable: true
          enum: [ingest, retranscode, null]
          description: The purpose of that job; null when there is none.
        library_cleanup_after:
          type: string
          format: date-time
          nullable: true
          description: |
            When the watcher removes the versions a retranscode replaced
            (every URL signed for them has expired by then); null when none
            wait.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AdminMovieList:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminMovie" }
        total: { type: integer, format: int64 }
        limit: { type: integer }
        offset: { type: integer, format: int64 }

    Movie:
      type: object
      additionalProperties: false
      required: [id, title, year, tmdb_id, overview, runtime_sec, status, poster_url, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        year: { type: integer, nullable: true }
        tmdb_id: { type: integer, nullable: true }
        overview: { type: string, nullable: true }
        runtime_sec: { type: integer, nullable: true }
        status: { $ref: "#/components/schemas/MovieStatus" }
        poster_url:
          type: string
          nullable: true
          description: |
            Signed path on media-delivery, valid for at least 24 hours:
            /media/{token}/{expires}/{id}/{version}/poster.jpg (movies
            published before versions: without the {version}/ folder).
          pattern: "^/media/[A-Za-z0-9_-]{22}/[0-9]+/[0-9a-f-]{36}/"
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MovieList:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Movie" }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Movies matching the filter, across all pages.
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, format: int64, minimum: 0 }

    MovieDetail:
      description: |
        A Movie plus `renditions`. Spelled out rather than allOf, because
        allOf cannot extend a schema that forbids additional properties.
      type: object
      additionalProperties: false
      required: [id, title, year, tmdb_id, overview, runtime_sec, status, poster_url, created_at, updated_at, renditions]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        year: { type: integer, nullable: true }
        tmdb_id: { type: integer, nullable: true }
        overview: { type: string, nullable: true }
        runtime_sec: { type: integer, nullable: true }
        status: { $ref: "#/components/schemas/MovieStatus" }
        poster_url: { $ref: "#/components/schemas/Movie/properties/poster_url" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        renditions:
          type: array
          description: HLS rungs, tallest first.
          items: { $ref: "#/components/schemas/Rendition" }

    Rendition:
      type: object
      additionalProperties: false
      required: [height, bitrate_kbps, size_bytes]
      properties:
        height: { type: integer, minimum: 1 }
        bitrate_kbps: { type: integer, nullable: true }
        size_bytes: { type: integer, format: int64, nullable: true }

    Playback:
      type: object
      additionalProperties: false
      required: [movie_id, playlist_url, thumbnails_url, resume_sec]
      properties:
        movie_id: { type: string, format: uuid }
        playlist_url:
          type: string
          description: |
            Signed master playlist on media-delivery,
            /media/{token}/{expires}/{movie_id}/{version}/master.m3u8, the
            version the movie plays from now (a retranscode publishes a new
            one; movies published before versions have no {version}/
            folder). Rung playlists and segments are relative to it and
            inherit the token.
          pattern: "^/media/[A-Za-z0-9_-]{22}/[0-9]+/[0-9a-f-]{36}/([0-9a-f-]{36}/)?master\\.m3u8$"
        thumbnails_url:
          type: string
          description: |
            WebVTT index of the seek-preview sprites. Each cue's text is a
            sprite image relative to this URL plus a `#xywh=x,y,w,h` fragment.
          pattern: "^/media/[A-Za-z0-9_-]{22}/[0-9]+/[0-9a-f-]{36}/([0-9a-f-]{36}/)?thumbnails\\.vtt$"
        resume_sec:
          type: integer
          nullable: true
          minimum: 1
          description: |
            Where the caller stopped last time, in seconds; null when there
            is nothing to resume (no progress, or watched to 95% or more).

    ProgressRequest:
      type: object
      additionalProperties: false
      required: [movie_id, position_sec]
      properties:
        movie_id: { type: string, format: uuid }
        position_sec:
          type: integer
          minimum: 0
          description: Whole seconds from the start of the movie.

    ContinueWatching:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ContinueWatchingItem" }

    ContinueWatchingItem:
      type: object
      additionalProperties: false
      required: [movie, position_sec, runtime_sec, updated_at]
      properties:
        movie: { $ref: "#/components/schemas/Movie" }
        position_sec: { type: integer, minimum: 0 }
        runtime_sec: { type: integer, nullable: true }
        updated_at:
          type: string
          format: date-time
          description: When this position was saved.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1, writeOnly: true }
        turnstile_token:
          type: string
          maxLength: 2048
          description: A solved Turnstile challenge; needed after 3 failures (401 `captcha_required`).

    AuthConfig:
      type: object
      additionalProperties: false
      required: [registration_open, turnstile_site_key, google_enabled]
      properties:
        google_enabled:
          type: boolean
          description: Whether to show "Continue with Google".
        registration_open:
          type: boolean
          description: Whether register accepts sign-ups; hide the link when false.
        turnstile_site_key:
          type: string
          nullable: true
          description: The public key for the Turnstile widget; null when not configured.

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, username, password, turnstile_token]
      properties:
        email:
          type: string
          maxLength: 254
          description: A bare address (no display name); stored lowercase.
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            1 to 64 characters of a-z, 0-9, `.`, `_`, `-`, starting with a
            letter or digit (lowercased first). Public.
        password:
          type: string
          writeOnly: true
          minLength: 12
          maxLength: 1024
        turnstile_token: { type: string, maxLength: 2048 }

    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          writeOnly: true
          description: The `token` from the link's fragment.

    ResendVerificationRequest:
      type: object
      additionalProperties: false
      required: [email, turnstile_token]
      properties:
        email: { type: string, maxLength: 254 }
        turnstile_token: { type: string, maxLength: 2048 }

    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email, turnstile_token]
      properties:
        email: { type: string, maxLength: 254 }
        turnstile_token: { type: string, maxLength: 2048 }

    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token:
          type: string
          writeOnly: true
          description: The `token` from the link's fragment.
        new_password:
          type: string
          writeOnly: true
          minLength: 12
          maxLength: 1024

    GoogleLinkRequest:
      type: object
      additionalProperties: false
      required: [current_password]
      properties:
        current_password: { type: string, minLength: 1, writeOnly: true }

    GoogleLink:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          description: The Google authorization URL to navigate to.

    Accepted:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message: { type: string }

    User:
      type: object
      additionalProperties: false
      required: [id, username, role]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { type: string, enum: [user, admin] }

    Session:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
          description: "HS256 JWT; send as `Authorization: Bearer …`. Keep in memory only."
        token_type: { type: string, enum: [Bearer] }
        expires_in:
          type: integer
          description: Seconds until the access token expires (900).
        user: { $ref: "#/components/schemas/User" }

    Account:
      type: object
      additionalProperties: false
      required: [id, username, role, email, email_verified_at, created_at, has_password, google]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        role: { type: string, enum: [user, admin] }
        email:
          type: string
          nullable: true
          description: |
            Fixed at registration. null for an account made with useradmin,
            which therefore has no password reset by mail.
        email_verified_at:
          type: string
          format: date-time
          nullable: true
          description: When the address was confirmed; null while it is not.
        created_at:
          type: string
          format: date-time
          description: When the account was created (member since).
        has_password:
          type: boolean
          description: false for an account made by signing in with Google that has not set one.
        google:
          type: object
          nullable: true
          additionalProperties: false
          required: [email_at_link, linked_at]
          description: The linked Google account, or null.
          properties:
            email_at_link:
              type: string
              nullable: true
              description: The Google address when it was linked; shown only, never used to identify.
            linked_at: { type: string, format: date-time }

    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string, minLength: 1, writeOnly: true }
        new_password:
          type: string
          writeOnly: true
          minLength: 12
          maxLength: 1024
          description: 12 to 1024 characters, different from the current password.

    SessionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LoginSession" }

    LoginSession:
      type: object
      additionalProperties: false
      required: [id, user_agent, created_at, last_used_at, current]
      properties:
        id:
          type: string
          format: uuid
          description: The session id (its refresh-token family).
        user_agent:
          type: string
          description: |
            The browser that logged in, summed up: "Firefox on Linux", or
            "Unknown device". From the User-Agent header, so only a label.
        created_at:
          type: string
          format: date-time
          description: The login.
        last_used_at:
          type: string
          format: date-time
          description: The last refresh (or the login, if none since).
        current:
          type: boolean
          description: The session of the access token that asked.

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - not_found
                - not_ready
                - method_not_allowed
                - internal
                - unauthorized
                - invalid_credentials
                - forbidden
                - rate_limited
                - unsupported_media_type
                - captcha_required
                - captcha_failed
                - captcha_unavailable
                - email_not_verified
                - registration_closed
                - username_taken
                - invalid_token
                - last_login_method
                - account_disabled
                - self_change
                - last_admin
                - not_failed
                - job_active
            message: { type: string }
