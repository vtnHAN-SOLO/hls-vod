# Local development only. Tests never use this database (see CLAUDE.md Testing).
# All credentials come from .env, which is gitignored; this file holds no values.
# The compose project name decides the volume names. Public copies use the
# folder's name (compose's default).

services:
  postgres:
    image: postgres:16.15-alpine3.24 # keep in sync with internal/pgtest.Image
    env_file: .env
    ports:
      # 127.0.0.1 only: Docker-published ports bypass ufw, so a bare
      # "5432:5432" would expose Postgres to the whole LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  # Serves $MEDIA_ROOT/library/{id}/... at
  # http://127.0.0.1:8081/media/{token}/{expires}/{id}/..., to URLs the api
  # signed with MEDIA_SIGNING_KEY. The image is docker/media-delivery.Dockerfile
  # (the config template and the key guard baked in); `make media-up`
  # rebuilds it. Hardened like production: read-only root filesystem (only
  # /tmp and the rendered config dir are writable), no capabilities, UID
  # 65532, library mounted read-only.
  media-delivery:
    build:
      context: .
      dockerfile: docker/media-delivery.Dockerfile
    # Named, so compose never tags its build "latest"; make images builds
    # hls-vod/media-delivery:dev separately.
    image: hls-vod/media-delivery:local
    ports:
      # 127.0.0.1 only (see postgres). 8080 on the host is the api.
      - "127.0.0.1:8081:8080"
    # The signing key only, taken from .env; no value is written here. Not
    # env_file: that would hand nginx DATABASE_URL and every other secret in
    # .env. The image renders its template with it at start.
    environment:
      MEDIA_SIGNING_KEY: ${MEDIA_SIGNING_KEY:?set MEDIA_SIGNING_KEY in .env, generate it with openssl rand -base64 48}
    volumes:
      - type: bind
        source: ${MEDIA_ROOT:?set MEDIA_ROOT in .env, e.g. ./var/media}/library
        target: /srv/media/library
        read_only: true
        # Fail instead of creating an empty dir, which would look "ready".
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
      # The rendered config (it holds the key): memory only, owned by the image user.
      - /etc/nginx/conf.d:mode=0755,uid=65532,gid=65532
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s
    restart: unless-stopped

volumes:
  postgres-data:
